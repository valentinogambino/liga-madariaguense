version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: desarrollo
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    groups:
      minor-y-patch:
        update-types:
          - minor
          - patch
  - package-ecosystem: github-actions
    directory: /
    target-branch: desarrollo
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    groups:
      minor-y-patch:
        update-types:
          - minor
          - patch
